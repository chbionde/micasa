# MiCasa — cabeçalhos de segurança.
#
# Instalado em /etc/nginx/snippets/micasa-seguranca.conf pelo infra/aplicar-nginx.sh.
#
# POR QUE UM ARQUIVO SEPARADO: `add_header` no nginx NÃO é aditivo. Uma
# `location` que declare qualquer add_header próprio descarta TODOS os herdados
# do bloco `server`. Por isso estes cabeçalhos precisam ser repetidos em cada
# location que define add_header. Repetir cinco cabeçalhos em três lugares são
# quinze linhas para manter em sincronia à mão — e a primeira que envelhecer
# sozinha vira um buraco silencioso, justamente onde ninguém olha. Aqui eles
# moram uma vez, e as locations dão `include`.
#
# O `always` não torna o header aditivo: ele só decide se o cabeçalho vale
# também para respostas de erro (4xx, 5xx). Vale.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# ---------------------------------------------------------------------------
# Content-Security-Policy — issue #53
# ---------------------------------------------------------------------------
# São DOIS cabeçalhos, de propósito, e eles fazem coisas diferentes.
#
# 1) O que BLOQUEIA (abaixo) traz só diretivas que foram medidas como
#    impossíveis de quebrar esta aplicação:
#
#      object-src 'none'      não há <object> nem <embed> em lugar nenhum
#      base-uri 'none'        não há <base>; impede sequestro de URL relativa
#      frame-ancestors 'none' mesma coisa que o X-Frame-Options acima, na
#                             versão que os navegadores modernos respeitam
#      form-action 'self'     não há form com `action` — o React envia por JS
#
#    Isso já fecha três vetores reais (plugin injetado, sequestro de <base>,
#    clickjacking) sem nenhum risco de derrubar o site.
#
# 2) O que só RELATA (mais abaixo) é a política estrita de verdade. Ela não
#    bloqueia nada: o navegador obedece ao cabeçalho de cima e apenas reclama
#    no console sobre o de baixo. É o modo de descobrir o que a política
#    quebraria ANTES de ela quebrar, num site que publica sozinho a cada merge.
#
# Levantamento feito no build de 12/08/2026, e é o que sustenta a política
# estrita abaixo:
#
#   - dist/index.html não tem script nem style inline: um <script type=module>
#     e um <link rel=stylesheet>, ambos de /assets, mesma origem
#   - zero `style={{...}}` no código; o Tailwind compila para arquivo
#   - zero eval, new Function, Worker ou WebAssembly
#   - zero data: URI, iframe ou form com action
#   - zero url() e @font-face no CSS compilado — nada externo
#   - a API é da mesma origem (ADR-020), então connect-src 'self' basta
#
#   Uma ressalva medida: o bundle do React 19 contém o código de hoisting de
#   <style precedence>, que criaria <style> em tempo de execução. A aplicação
#   não renderiza <style> nem <link> em lugar nenhum, então esse caminho não
#   roda — mas é exatamente por causa de coisas assim que a política estrita
#   entra em modo relato primeiro, em vez de direto no ar.

add_header Content-Security-Policy "object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
