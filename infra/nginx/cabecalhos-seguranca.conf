# MiCasa — cabeçalhos de segurança.
#
# Instalado em /etc/nginx/snippets/micasa-seguranca.conf pelo infra/aplicar-nginx.sh.
#
# POR QUE UM ARQUIVO SEPARADO: `add_header` no nginx NÃO é aditivo. Uma
# `location` que declare qualquer add_header próprio descarta TODOS os herdados
# do bloco `server`. Por isso estes cabeçalhos precisam ser repetidos em cada
# location que define add_header. Repetir cinco cabeçalhos em três lugares são
# quinze linhas para manter em sincronia à mão — e a primeira que envelhecer
# sozinha vira um buraco silencioso, justamente onde ninguém olha. Aqui eles
# moram uma vez, e as locations dão `include`.
#
# O `always` não torna o header aditivo: ele só decide se o cabeçalho vale
# também para respostas de erro (4xx, 5xx). Vale.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# ---------------------------------------------------------------------------
# Strict-Transport-Security — issue #54, etapa 1 da rampa
# ---------------------------------------------------------------------------
# O navegador só aceita HSTS quando recebe este cabeçalho por HTTPS. Depois
# disso, ele passa a abrir o domínio diretamente em HTTPS durante o max-age,
# fechando a primeira requisição em texto claro que o redirecionamento não
# consegue proteger.
#
# Começamos com cinco minutos para limitar o impacto caso o TLS falhe. Depois
# de alguns dias de observação, a etapa 2 sobe para 2592000 (30 dias). Um ano
# só será considerado depois de uma renovação automática real do certificado.
#
# Sem includeSubDomains: o MiCasa não usa nomes abaixo de
# micasa-bionde.duckdns.org e não deve obrigar futuros subdomínios sem medir.
# Sem preload: retirar um domínio da lista embutida nos navegadores pode levar
# meses, desproporcional para um domínio gratuito.

add_header Strict-Transport-Security "max-age=300" always;

# ---------------------------------------------------------------------------
# Content-Security-Policy — issue #53
# ---------------------------------------------------------------------------
# A política estrita abaixo foi observada primeiro em
# Content-Security-Policy-Report-Only. Em 12/08/2026 o desenvolvedor navegou
# pelas telas autenticadas em janela anônima sem nenhuma violação de CSP; por
# isso ela passou a bloquear de verdade.
#
# Cada diretiva tem um papel explícito:
#
#   default-src 'self'      origem padrão: somente o próprio MiCasa
#   script-src 'self'       JavaScript compilado pelo Vite, em /assets
#   style-src 'self'        CSS compilado pelo Tailwind, em /assets
#   img-src 'self'          imagens servidas pelo próprio MiCasa
#   font-src 'self'         fontes locais; hoje não há fonte externa
#   connect-src 'self'      API na mesma origem, conforme o ADR-020
#   object-src 'none'       não há <object> ou <embed>; bloqueia plugins
#   base-uri 'none'         não há <base>; impede sequestro de URL relativa
#   frame-ancestors 'none'  impede enquadramento e clickjacking
#   form-action 'self'      impede envio de formulário para outra origem
#
# Levantamento feito no build de 12/08/2026:
#
#   - dist/index.html não tem script nem style inline: um <script type=module>
#     e um <link rel=stylesheet>, ambos de /assets, mesma origem
#   - zero `style={{...}}` no código; o Tailwind compila para arquivo
#   - zero eval, new Function, Worker ou WebAssembly
#   - zero data: URI, iframe ou form com action
#   - zero url() e @font-face no CSS compilado — nada externo
#   - a API é da mesma origem (ADR-020), então connect-src 'self' basta
#
# Uma ressalva medida: o bundle do React 19 contém o código de hoisting de
#   <style precedence>, que criaria <style> em tempo de execução. A aplicação
#   não renderiza <style> nem <link> em lugar nenhum, então esse caminho não
#   roda. Se esse comportamento ou uma dependência externa entrar no futuro,
#   teste a nova política em Report-Only antes de afrouxar ou publicar.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
