name: CI Web

# SEM filtro de `paths:`, de propósito — a justificativa completa está no
# ci-api.yml e na issue #47. Resumo: PR que não toca `web/` não disparava check
# nenhum, o que impedia exigir status check na `main`. Este workflow leva 25–43 s.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Era `quality`, igual ao do ci-api.yml — dois checks com o mesmo nome.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Mesma ideia do ci-api.yml, com uma diferença que vale saber: o npm TEM
      # corte por severidade, e aqui ele está em `high`. Baixa e moderada não
      # reprovam.
      #
      # O corte existe porque a árvore de dependências do front é ordens de
      # grandeza maior que a do PHP, e quase todo aviso moderado dela cai em
      # pacote de build que nunca vê entrada de usuário. Sem o corte, o CI
      # ficaria vermelho por ruído e a gente aprenderia a ignorá-lo — que é
      # exatamente o fracasso que este passo tenta evitar.
      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Oxlint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Vitest (testes)
        run: npm run test
