name: CI Web

# SEM filtro de `paths:`, de propósito — a justificativa completa está no
# ci-api.yml e na issue #47. Resumo: PR que não toca `web/` não disparava check
# nenhum, o que impedia exigir status check na `main`. Este workflow leva 25–43 s.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Era `quality`, igual ao do ci-api.yml — dois checks com o mesmo nome.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Oxlint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Vitest (testes)
        run: npm run test
