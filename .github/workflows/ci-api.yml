name: CI API

# SEM filtro de `paths:`, de propósito — ver issue #47.
#
# O filtro (`api/**`) parecia economia óbvia, mas uma PR que só toque `docs/`,
# `infra/` ou `.github/` não disparava workflow NENHUM. Isso torna impossível
# exigir status check na `main`: o check obrigatório nunca chegaria e a PR ficaria
# travada para sempre esperando algo que não vai rodar. A PR #46 provou o caso —
# só mexia em `infra/` e reportou "no checks".
#
# O que a economia valia, medido: este workflow leva 29–39 s. Meio minuto por PR,
# em runner de repositório público, que não consome cota. Não paga o pé-de-cabra.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # O nome do job vira o nome do check. Os dois workflows chamavam o seu de
  # `quality`, o que produzia dois checks homônimos e tornava ambígua qualquer
  # regra que exigisse "o check quality".
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Instalar dependências
        run: composer install --prefer-dist --no-progress --no-interaction

      # Reprova a PR que trouxer dependência com aviso de segurança publicado.
      #
      # Isto NÃO substitui o Dependabot, que já está ligado — ele avisa depois
      # que a dependência entrou. Este passo pega antes, no momento em que ela
      # entraria. Os dois olham a mesma base de avisos, em momentos diferentes.
      #
      # ⚠️ TROCA CONSCIENTE: o `composer audit` não tem corte por severidade;
      # reprova com QUALQUER aviso. Isso significa que um aviso publicado de
      # madrugada deixa o CI vermelho numa PR que não tem nada a ver com
      # dependência. É atrito real, aceito de propósito — num projeto de 5 h
      # por semana, o alerta que não bloqueia é o alerta que se ignora.
      - name: Auditoria de dependências
        run: composer audit --no-interaction

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (formatação)
        run: vendor/bin/pint --test

      - name: Larastan (análise estática)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pest (testes)
        run: php artisan test
